<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Encrypted Chat Sandbox</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; padding: 40px; color: white; }
    .chat-window { max-width: 450px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
    .message-bubble { background: #334155; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; }
    input { width: 70%; padding: 10px; border-radius: 6px; border: none; }
    button { padding: 10px 16px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="chat-window">
    <h3>Endpoint Decrypted Chat View</h3>
    <div id="messages">
      <div class="message-bubble chat-text">Kamusta? Ito ang baseline clean message.</div>
    </div>
    <div style="margin-top: 15px;">
      <input type="text" id="msgInput" placeholder="Type a message...">
      <button onclick="addMessage()">Send</button>
    </div>
  </div>

  <script>
    function addMessage() {
      const val = document.getElementById('msgInput').value;
      if (!val) return;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble chat-text';
      bubble.innerText = val;
      document.getElementById('messages').appendChild(bubble);
      document.getElementById('msgInput').value = '';
    }
  </script>
</body>
</html>
