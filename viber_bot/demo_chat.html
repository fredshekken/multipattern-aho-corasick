<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phishing Guard — Viber Simulation</title>
<style>
  :root {
    --viber-purple: #7360f2;
    --viber-dark: #4d3f8f;
    --bg: #f3f1fb;
    --tier2: #f5a623;
    --tier3: #e6483f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--bg); display: flex; justify-content: center;
  }
  .phone {
    width: 420px; height: 100vh; background: #fff; display: flex;
    flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }
  .header {
    background: var(--viber-purple); color: white; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 16px; margin: 0; }
  .header .sub { font-size: 11px; opacity: 0.85; }
  .controls {
    display: flex; gap: 8px; padding: 8px 12px; background: #ece9f8;
    border-bottom: 1px solid #ddd; align-items: center; flex-wrap: wrap;
  }
  .controls select, .controls button, .controls input {
    font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid #ccc;
  }
  .controls button {
    background: var(--viber-purple); color: white; border: none; cursor: pointer;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .bubble {
    max-width: 78%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: var(--viber-purple); color: white; border-bottom-right-radius: 3px; }
  .bot   { align-self: flex-start; background: #efeff4; color: #222; border-bottom-left-radius: 3px; }
  .bot.tier2 { background: #fff3e0; border: 1px solid var(--tier2); }
  .bot.tier3 { background: #fdeceb; border: 1px solid var(--tier3); }
  .tag { font-size: 10px; font-weight: bold; opacity: 0.6; display: block; margin-bottom: 4px; }
  .ack-btn {
    margin-top: 8px; background: var(--tier3); color: white; border: none;
    padding: 8px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; width: 100%;
  }
  .composer { display: flex; padding: 10px; border-top: 1px solid #ddd; gap: 8px; }
  .composer input {
    flex: 1; padding: 10px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 14px;
  }
  .composer button {
    background: var(--viber-purple); color: white; border: none; border-radius: 20px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  .status { font-size: 11px; padding: 4px 12px; color: #888; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div>
      <h1>Phishing Guard (Demo)</h1>
      <div class="sub" id="modeLabel">engine: enhanced</div>
    </div>
    <div class="sub">SIMULATION MODE</div>
  </div>

  <div class="controls">
    <label>User: <input id="userId" value="demo_user_1" size="10"></label>
    <label>Chat: <input id="chatId" value="chat_1" size="8"></label>
    <button onclick="setMode('enhanced')">Use Enhanced</button>
    <button onclick="setMode('baseline')">Use Baseline</button>
    <button onclick="newConversation()">New Chat</button>
  </div>

  <div class="messages" id="messages"></div>
  <div class="status" id="status">Server: checking...</div>

  <div class="composer">
    <input id="composerInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const SERVER = "http://localhost:5000";

function addBubble(text, cls) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;
  document.getElementById("messages").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
  return div;
}

function addBotBubble(msg) {
  const tierClass = msg.text.includes("CRITICAL") ? "tier3"
                   : msg.text.includes("Heads up") ? "tier2" : "";
  const div = addBubble(msg.text, "bot " + tierClass);
  if (msg.keyboard) {
    const btn = document.createElement("button");
    btn.className = "ack-btn";
    btn.textContent = msg.keyboard.Buttons[0].Text.replace(/<[^>]+>/g, "");
    btn.onclick = () => { sendRaw("ACK_BLOCK"); btn.remove(); };
    div.appendChild(document.createElement("br"));
    div.appendChild(btn);
  }
}

async function sendRaw(text) {
  const userId = document.getElementById("userId").value;
  const chatId = document.getElementById("chatId").value;
  const payload = {
    event: "message",
    message: { type: "text", text: text },
    sender: { id: userId, name: userId },
    chat_id: chatId,
  };
  await fetch(SERVER + "/webhook", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  await pollOutbox();
}

async function sendMessage() {
  const input = document.getElementById("composerInput");
  const text = input.value.trim();
  if (!text) return;
  addBubble(text, "user");
  input.value = "";
  await sendRaw(text);
}

async function pollOutbox() {
  const userId = document.getElementById("userId").value;
  const resp = await fetch(SERVER + "/simulate/outbox/" + encodeURIComponent(userId));
  const data = await resp.json();
  data.messages.forEach(addBotBubble);
}

async function setMode(mode) {
  await sendRaw("/mode " + mode);
  document.getElementById("modeLabel").textContent = "engine: " + mode;
}

function newConversation() {
  document.getElementById("messages").innerHTML = "";
  document.getElementById("chatId").value = "chat_" + Math.floor(Math.random() * 10000);
}

async function checkHealth() {
  try {
    const resp = await fetch(SERVER + "/health");
    const data = await resp.json();
    document.getElementById("status").textContent =
      `Server: OK | simulation=${data.simulation_mode} | engine=${data.engine_mode} | patterns=${data.patterns_loaded}`;
    document.getElementById("modeLabel").textContent = "engine: " + data.engine_mode;
  } catch (e) {
    document.getElementById("status").textContent = "Server: NOT REACHABLE — is server.py running on port 5000?";
  }
}

checkHealth();
setInterval(checkHealth, 5000);
</script>
</body>
</html>
